openapi: 3.1.0
info:
  title: Link Shortener API
  version: 1.0.0
  description: |
    API del servicio de acortamiento de enlaces (TP Integrador PP6, Etapa 1).

    Contrato definido antes de la implementación (contract-first, ADR-0008).
    La página web y la extensión para Chrome/Firefox consumen esta misma API.

    Reglas principales:
    - Un enlace es vigente durante 60 minutos desde su creación.
    - Cada enlace recibe el menor alias libre: primero por largo y después por el
      orden del alfabeto `123456789abcdefghijkmnpqrstuvwxyz` (`1`, `2`, … `z`, `11`, …),
      salteando las palabras reservadas (ADR-0026).
    - Un alias vencido queda libre y puede reasignarse.

    Sesión (Etapa 2, ADR-0030): el usuario inicia sesión con Google navegando a
    `/oauth2/authorization/google`. Si el login falla o se cancela, vuelve a `/?login=error`
    sin sesión. La sesión se mantiene con la cookie `JSESSIONID`. Los pedidos que modifican
    datos de la sesión (como `POST /logout`) envían el encabezado `X-XSRF-TOKEN` con el valor
    de la cookie `XSRF-TOKEN`. Los endpoints anónimos no requieren sesión.

    Login con QR (Etapa 2, ADR-0033): la computadora crea un pedido (`POST /api/v1/auth/qr-logins`),
    muestra su QR y lo consulta cada 2 segundos con el secreto en `X-Qr-Secret`. El celular abre la
    dirección del QR, inicia sesión con Google y autoriza o rechaza. Si autoriza, la computadora
    canjea el pedido por una sesión. El pedido vence a los 2 minutos y se usa una sola vez.
# Los endpoints son públicos salvo los que declaran `security: [sesion: []]`.
security: []
servers:
  - url: http://localhost:8080
    description: Desarrollo local (la URL base real se configura con app.base-url)
tags:
  - name: Enlaces
    description: Creación de enlaces cortos
  - name: QR
    description: Código QR de un enlace
  - name: Redirección
    description: Acceso a la URL corta (fuera de /api)
  - name: Usuario
    description: Usuario con sesión iniciada con Google (Etapa 2)
  - name: Login con QR
    description: Iniciar sesión en la computadora autorizándolo desde el celular (Etapa 2, ADR-0033)

paths:
  /api/v1/links:
    post:
      tags: [Enlaces]
      operationId: createLink
      summary: Acortar una URL
      description: |
        Crea un enlace corto para la URL indicada. Cada pedido genera un alias nuevo,
        aunque la URL ya tenga un enlace vigente (ADR-0017).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
            example:
              url: https://drive.google.com/drive/folders/1AbCdEfGhIjKlMnOpQrStUvWxYz?usp=sharing
      responses:
        '201':
          description: Enlace creado
          headers:
            Location:
              description: URL corta del enlace creado
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: |
            URL inválida (vacía, de más de 2048 caracteres, no absoluta, sin host,
            esquema distinto de http/https) o perteneciente al propio servicio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: La URL debe ser absoluta y usar el esquema http o https.
                instance: /api/v1/links
        '503':
          description: No se pudo generar un alias libre tras el máximo de intentos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/links/{alias}/qr:
    get:
      tags: [QR]
      operationId: getLinkQr
      summary: Obtener el código QR de un enlace vigente
      description: |
        Devuelve una imagen PNG de 300 × 300 píxeles con un QR que codifica la URL corta
        (ADR-0023). No crea enlaces ni renueva su vigencia. La respuesta no se almacena
        en caché: cada pedido vuelve a comprobar que el enlace está vigente.
      parameters:
        - $ref: '#/components/parameters/Alias'
      responses:
        '200':
          description: Imagen PNG del código QR
          headers:
            Cache-Control:
              description: Evita almacenar la respuesta para volver a comprobar la vigencia.
              schema:
                type: string
                enum: [no-store]
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '404':
          description: El alias no existe o el enlace está vencido.
          headers:
            Cache-Control:
              description: Evita almacenar el error; un alias vencido puede reasignarse.
              schema:
                type: string
                enum: [no-store]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /{alias}:
    get:
      tags: [Redirección]
      operationId: redirect
      summary: Redirigir a la URL original
      description: |
        URL corta pública. Solo acepta un segmento alfanumérico; las palabras reservadas
        (api, error, v3, swagger) nunca son alias (ADR-0011).
        Responde 302 y no 301, porque el alias vence y puede reasignarse (ADR-0012).
      parameters:
        - $ref: '#/components/parameters/Alias'
      responses:
        '302':
          description: Enlace vigente; redirige a la URL original.
          headers:
            Location:
              description: URL original
              schema:
                type: string
                format: uri
        '404':
          description: |
            El alias no existe o el enlace está vencido. Se muestra una página HTML
            informativa, sin distinguir ambos casos (ADR-0018).
          content:
            text/html:
              schema:
                type: string

  /api/v1/me:
    get:
      tags: [Usuario]
      operationId: getCurrentUser
      summary: Usuario con sesión iniciada
      description: |
        Datos del usuario que inició sesión con Google. `namespace` es `null` hasta que
        el usuario elige su espacio de nombres. Los clientes lo usan para saber si hay sesión.
      security:
        - sesion: []
      responses:
        '200':
          description: Hay una sesión iniciada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: No hay una sesión iniciada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/me/namespace:
    put:
      tags: [Usuario]
      operationId: setNamespace
      summary: Elegir o cambiar el espacio de nombres
      description: |
        Asigna el espacio de nombres del usuario con sesión (`notes.io/melina/1`). La primera vez
        lo crea; después lo cambia y el anterior queda libre para otros usuarios (ADR-0031).
        El nombre se guarda en minúsculas: `Melina` y `melina` son el mismo espacio.
        Solo letras y números, hasta 15 caracteres (límite técnico, ADR-0029), y no puede ser un
        nombre reservado por el sistema. Requiere el encabezado `X-XSRF-TOKEN`.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NamespaceRequest'
      responses:
        '200':
          description: Espacio guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceResponse'
        '400':
          description: Nombre inválido (caracteres no permitidos, más de 15 caracteres o reservado).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: No hay una sesión iniciada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Falta el encabezado `X-XSRF-TOKEN` o no coincide con la cookie.
        '409':
          description: El espacio ya pertenece a otro usuario.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/me/links:
    post:
      tags: [Usuario]
      operationId: createNamespaceLink
      summary: Acortar una URL dentro del espacio del usuario
      description: |
        Crea un enlace `{app.base-url}/{espacio}/{código}` vigente durante 60 minutos (ADR-0032).
        Sin `code`, se asigna el menor código libre del espacio (`1`, `2`, …), con las mismas reglas
        que el camino anónimo (ADR-0026). Con `code`, se usa ese código si está libre en el espacio:
        letras minúsculas, números, `-` y `_`, hasta 15 caracteres (límite técnico, ADR-0029); se
        guarda en minúsculas. Un código vencido vuelve a estar disponible. Los códigos solo son
        únicos dentro de cada espacio. Requiere haber elegido el espacio y el encabezado `X-XSRF-TOKEN`.
      security:
        - sesion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceLinkRequest'
      responses:
        '201':
          description: Enlace creado.
          headers:
            Location:
              description: URL corta creada.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          description: URL inválida o código personalizado inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: No hay una sesión iniciada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Falta el encabezado `X-XSRF-TOKEN` o no coincide con la cookie.
        '409':
          description: El usuario todavía no eligió su espacio, o el código personalizado ya está en uso en su espacio.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: No se encontró un código libre tras varios intentos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/namespaces/{namespace}/links/{code}/qr:
    get:
      tags: [QR]
      operationId: getNamespaceLinkQr
      summary: Obtener el código QR de un enlace vigente de un espacio
      description: PNG de 300 × 300 píxeles de la URL corta. No crea enlaces ni renueva su vigencia.
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Code'
      responses:
        '200':
          description: Imagen PNG del código QR.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '404':
          description: El espacio o el código no existen, o el enlace está vencido.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /{namespace}/{code}:
    get:
      tags: [Redirección]
      operationId: redirectNamespaceLink
      summary: Redirigir a la URL original de un enlace de un espacio
      description: |
        URL corta de un usuario registrado (`notes.io/melina/1`). El espacio y el código se tratan
        en minúsculas: `/Melina/1` equivale a `/melina/1`. Responde 302 (ADR-0012), o 404 con la
        misma página HTML que el camino anónimo si el espacio o el código no existen o el enlace
        venció (ADR-0018). Al cambiar de espacio, los enlaces del anterior dejan de funcionar.
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/Code'
      responses:
        '302':
          description: Enlace vigente; redirige a la URL original.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: Espacio o código inexistente, o enlace vencido.
          content:
            text/html:
              schema:
                type: string

  /api/v1/auth/qr-logins:
    post:
      tags: [Login con QR]
      operationId: createQrLogin
      summary: Crear un pedido de login con QR
      description: |
        La computadora lo pide sin sesión. Devuelve el `code` que va en el QR y un `secret`
        que solo conoce quien hizo el pedido: sin él no se puede consultar ni canjear.
        El pedido vence a los 2 minutos.
      security: []
      responses:
        '201':
          description: Pedido creado en estado `PENDING`.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrLoginResponse'

  /api/v1/auth/qr-logins/{code}:
    get:
      tags: [Login con QR]
      operationId: getQrLoginStatus
      summary: Consultar el estado de un pedido de login
      description: |
        La computadora lo consulta cada 2 segundos con el secreto en el encabezado `X-Qr-Secret`.
        Estados: `PENDING` (esperando al celular), `AUTHORIZED`, `REJECTED`, `USED` (ya canjeado)
        y `EXPIRED` (venció sin canjearse).
      security: []
      parameters:
        - $ref: '#/components/parameters/QrCode'
        - $ref: '#/components/parameters/QrSecret'
      responses:
        '200':
          description: Estado actual del pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrLoginStatusResponse'
        '400':
          description: Falta el encabezado `X-Qr-Secret`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: El pedido no existe o el secreto no corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/auth/qr-logins/{code}/qr:
    get:
      tags: [Login con QR]
      operationId: getQrLoginQr
      summary: Imagen del QR de un pedido de login
      description: PNG que codifica `{app.base-url}/qr-login.html?c={code}`, la página que abre el celular.
      security: []
      parameters:
        - $ref: '#/components/parameters/QrCode'
      responses:
        '200':
          description: Imagen PNG del QR.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: El código es demasiado largo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/auth/qr-logins/{code}/session:
    post:
      tags: [Login con QR]
      operationId: createQrLoginSession
      summary: Canjear un pedido autorizado por una sesión
      description: |
        Abre la sesión (cookie `JSESSIONID`) en la computadora que hizo el pedido. Funciona una sola vez
        y solo si el celular lo autorizó antes de que venza.
      security: []
      parameters:
        - $ref: '#/components/parameters/QrCode'
        - $ref: '#/components/parameters/QrSecret'
      responses:
        '204':
          description: Sesión iniciada.
        '404':
          description: El pedido no existe o el secreto no corresponde.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: No fue autorizado, fue rechazado, venció o ya se usó.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/auth/qr-logins/{code}/authorize:
    post:
      tags: [Login con QR]
      operationId: authorizeQrLogin
      summary: Autorizar el ingreso en la computadora
      description: Lo hace el celular con sesión de Google. Requiere el encabezado `X-XSRF-TOKEN`.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/QrCode'
      responses:
        '204':
          description: Ingreso autorizado.
        '401':
          description: No hay una sesión iniciada en el celular.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Falta el encabezado `X-XSRF-TOKEN` o no coincide con la cookie.
        '404':
          description: El pedido no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: El pedido venció o ya fue respondido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/auth/qr-logins/{code}/reject:
    post:
      tags: [Login con QR]
      operationId: rejectQrLogin
      summary: Rechazar el ingreso en la computadora
      description: Lo hace el celular con sesión de Google. Requiere el encabezado `X-XSRF-TOKEN`.
      security:
        - sesion: []
      parameters:
        - $ref: '#/components/parameters/QrCode'
      responses:
        '204':
          description: Ingreso rechazado.
        '401':
          description: No hay una sesión iniciada en el celular.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Falta el encabezado `X-XSRF-TOKEN` o no coincide con la cookie.
        '404':
          description: El pedido no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: El pedido venció o ya fue respondido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /logout:
    post:
      tags: [Usuario]
      operationId: logout
      summary: Cerrar sesión
      description: Cierra la sesión actual. Requiere el encabezado `X-XSRF-TOKEN`.
      security:
        - sesion: []
      responses:
        '204':
          description: Sesión cerrada.
        '403':
          description: Falta el encabezado `X-XSRF-TOKEN` o no coincide con la cookie.

components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sesión iniciada con Google mediante `/oauth2/authorization/google` (ADR-0030).

  parameters:
    QrCode:
      name: code
      in: path
      required: true
      description: Código público del pedido de login (el que va en el QR)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
        maxLength: 64
    QrSecret:
      name: X-Qr-Secret
      in: header
      required: true
      description: Secreto del pedido, conocido solo por la computadora que lo creó
      schema:
        type: string
    Alias:
      name: alias
      in: path
      required: true
      description: Alias del enlace
      schema:
        type: string
        pattern: '^[A-Za-z0-9]+$'
      example: '1'

    Namespace:
      name: namespace
      in: path
      required: true
      description: Espacio de nombres (se trata en minúsculas)
      schema:
        type: string
        pattern: '^[A-Za-z0-9]+$'
      example: melina
    Code:
      name: code
      in: path
      required: true
      description: Código del enlace dentro del espacio (se trata en minúsculas)
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
      example: final-2026

  schemas:
    CreateNamespaceLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: URL original absoluta con esquema http o https.
        code:
          type: [string, 'null']
          maxLength: 15
          description: Código personalizado opcional. Si falta o está vacío, se asigna uno automático.
          example: tp_java

    UserResponse:
      type: object
      required: [name, email, namespace]
      properties:
        name:
          type: [string, 'null']
          description: Nombre informado por Google.
          example: Melina
        email:
          type: [string, 'null']
          example: melina@example.org
        namespace:
          type: [string, 'null']
          description: Espacio de nombres del usuario, o `null` si todavía no lo eligió.
          example: melina

    NamespaceRequest:
      type: object
      required: [namespace]
      properties:
        namespace:
          type: string
          minLength: 1
          description: Nombre pedido. Se guarda en minúsculas.
          example: Joana23

    NamespaceResponse:
      type: object
      required: [namespace]
      properties:
        namespace:
          type: string
          description: Nombre guardado, en minúsculas.
          example: joana23

    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          description: URL original absoluta con esquema http o https.

    LinkResponse:
      type: object
      required: [alias, shortUrl, originalUrl, createdAt, expiresAt]
      properties:
        alias:
          type: string
          example: '1'
        shortUrl:
          type: string
          format: uri
          description: URL corta, `{app.base-url}/{alias}`.
          example: http://192.168.1.50/1
        originalUrl:
          type: string
          format: uri
          example: https://drive.google.com/drive/folders/1AbCdEfGhIjKlMnOpQrStUvWxYz?usp=sharing
        createdAt:
          type: string
          format: date-time
          description: Momento de creación (UTC).
          example: '2026-10-05T13:00:00Z'
        expiresAt:
          type: string
          format: date-time
          description: Momento a partir del cual el enlace deja de redirigir (UTC).
          example: '2026-10-05T14:00:00Z'

    QrLoginResponse:
      type: object
      required: [code, secret, expiresAt]
      properties:
        code:
          type: string
          description: Código público que va en el QR.
        secret:
          type: string
          description: Secreto de la computadora. Solo se entrega acá.
        expiresAt:
          type: string
          format: date-time
          description: Momento a partir del cual el pedido deja de servir (UTC).
          example: '2026-10-05T13:02:00Z'

    QrLoginStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, AUTHORIZED, REJECTED, USED, EXPIRED]

    ProblemDetail:
      type: object
      description: Error en formato RFC 9457.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
