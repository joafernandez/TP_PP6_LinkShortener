spring.application.name=linkshortener

# Los tests usan HSQLDB en memoria: no dependen ni modifican la base en database/.
spring.datasource.url=jdbc:hsqldb:mem:linkshortener-test;shutdown=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.base-url=http://short.test
app.link.ttl=60m
app.alias.alphabet=123456789abcdefghijkmnpqrstuvwxyz
app.alias.max-attempts=10
app.alias.reserved=api,error,v3,swagger,login,logout

# Los tests simulan el login con Google: no necesitan credenciales reales.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
