spring.application.name=linkshortener

# Los tests usan HSQLDB en memoria: no dependen ni modifican la base en database/.
spring.datasource.url=jdbc:hsqldb:mem:linkshortener-test;shutdown=true
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.base-url=http://short.test
app.link.ttl=60m
app.alias.length=5
app.alias.alphabet=23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz
app.alias.max-attempts=10
app.alias.reserved=api,error,v3,swagger
