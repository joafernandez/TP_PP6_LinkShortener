spring.application.name=linkshortener

# Base de datos HSQLDB en modo archivo.
# La ruta por defecto asume que la aplicación se ejecuta desde backend/;
# puede cambiarse con la variable de entorno APP_DB_PATH.
spring.datasource.url=jdbc:hsqldb:file:${APP_DB_PATH:../database/linkshortener};shutdown=true
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# El esquema no lo genera Hibernate: se definirá con migraciones (Flyway) a partir del incremento 3.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
