spring.application.name=linkshortener

# Base de datos HSQLDB en modo archivo.
# La ruta por defecto asume que la aplicación se ejecuta desde backend/;
# puede cambiarse con la variable de entorno APP_DB_PATH.
spring.datasource.url=jdbc:hsqldb:file:${APP_DB_PATH:../database/linkshortener};shutdown=true
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Link Shortener (ver docs/arquitectura.md, sección 6)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.link.ttl=60m
app.alias.alphabet=123456789abcdefghijkmnpqrstuvwxyz
app.alias.max-attempts=10
app.alias.reserved=api,error,v3,swagger,login,logout
# Nombres que no pueden usarse como espacio porque chocan con rutas del sistema (ADR-0029)
app.namespace.reserved=api,assets,v3,error,login,logout,oauth2,swagger

# Login con Google (ADR-0030). Las credenciales se leen de variables de entorno y nunca se versionan.
# Sin ellas la aplicación arranca igual; solo el login con Google no funciona.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:sin-configurar}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:sin-configurar}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
