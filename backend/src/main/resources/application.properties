spring.application.name=linkshortener

# Base de datos HSQLDB en modo archivo.
# La ruta por defecto asume que la aplicación se ejecuta desde backend/;
# puede cambiarse con la variable de entorno APP_DB_PATH.
spring.datasource.url=jdbc:hsqldb:file:${APP_DB_PATH:../database/linkshortener};shutdown=true
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
# El esquema lo crean las migraciones de Flyway (db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Link Shortener (ver docs/arquitectura.md, sección 6)
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.link.ttl=60m
app.alias.length=5
app.alias.alphabet=23456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz
app.alias.max-attempts=10
app.alias.reserved=api,error,v3,swagger
