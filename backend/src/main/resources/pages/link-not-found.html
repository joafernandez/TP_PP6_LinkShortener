<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Enlace no disponible</title>
	<style>
		:root { color-scheme: light dark; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: system-ui, sans-serif;
			background: #f5f5f5;
			color: #222;
		}
		main { max-width: 32rem; padding: 2rem 1.5rem; text-align: center; }
		h1 { font-size: 1.5rem; margin: 0 0 1rem; }
		p { line-height: 1.5; margin: 0; }
		@media (prefers-color-scheme: dark) {
			body { background: #1b1b1b; color: #eee; }
		}
	</style>
</head>
<body>
	<main>
		<h1>Enlace no disponible</h1>
		<p>El enlace que abriste no existe o ya venció. Los enlaces cortos son válidos durante 60 minutos desde que se generan.</p>
	</main>
</body>
</html>
