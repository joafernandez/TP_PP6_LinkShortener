plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'app'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-hsqldb'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'com.google.zxing:core:3.5.4'
	implementation 'com.google.zxing:javase:3.5.4'
	// ADR-0030: login con Google mediante Spring Security (oauth2Login)
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	runtimeOnly 'org.hsqldb:hsqldb'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ADR-0013: una única fuente del frontend, incorporada al JAR como recursos estáticos.
tasks.named('processResources') {
	from('../frontend') {
		include 'index.html', 'assets/**'
		into 'static'
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	reports {
		html.required = true
		xml.required = true
	}
	// El reporte se genera siempre; después se verifica el umbral (ADR-0025).
	finalizedBy tasks.named('jacocoTestCoverageVerification')
}

// ADR-0025: umbral mínimo de cobertura. Si baja, la tarea falla y con ella `gradlew test`.
tasks.named('jacocoTestCoverageVerification') {
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.85
			}
		}
	}
}
